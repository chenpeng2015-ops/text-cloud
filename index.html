<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本云盘 - 管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <!-- 引入配置文件 -->
  <script src="./config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc; color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .navbar { height: 48px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 600; font-size: 14px; }
    .main-container { flex: 1; display: flex; overflow: hidden; position: relative; }
    .sidebar { width: 280px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-title { font-size: 13px; font-weight: 600; color: #475569; }
    .actions-group { display: flex; gap: 6px; }
    .icon-btn { padding: 4px 8px; border-radius: 4px; border: none; background: #2563eb; color: #fff; cursor: pointer; font-size: 12px; font-weight: 500; }
    .icon-btn.folder { background: #f59e0b; }
    .search-box { padding: 0 12px 10px; }
    .search-input { width: 100%; padding: 6px 10px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; }
    .file-tree { flex: 1; overflow-y: auto; padding: 4px; user-select: none; }
    .tree-node-wrapper { position: relative; }
    .tree-node { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-bottom: 2px; color: #334155; }
    .tree-node:hover { background: #f1f5f9; }
    .tree-node.active { background: #eff6ff; color: #2563eb; font-weight: 500; }
    .node-info { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .arrow { display: inline-block; width: 12px; font-size: 10px; color: #94a3b8; transition: transform 0.2s; }
    .arrow.open { transform: rotate(90deg); }
    .more-btn { display: none; padding: 2px 6px; border-radius: 4px; border: none; background: transparent; color: #64748b; font-weight: bold; cursor: pointer; font-size: 14px; }
    .tree-node:hover .more-btn { display: inline-block; }
    .dropdown-menu { position: absolute; right: 8px; top: 28px; z-index: 100; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 140px; padding: 4px 0; display: none; }
    .dropdown-item { padding: 6px 12px; font-size: 12px; color: #334155; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .dropdown-item:hover { background: #f8fafc; color: #2563eb; }
    .dropdown-item.danger:hover { background: #fef2f2; color: #ef4444; }
    .content-area { flex: 1; display: flex; flex-direction: column; background: #fff; overflow-y: auto; position: relative; }
    .editor-container { display: none; flex-direction: column; height: 100%; padding: 16px 24px; gap: 8px; position: relative; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; }
    
    .save-status { font-size: 12px; color: #10b981; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .save-status.unsaved { color: #f59e0b; }
    .save-status.saving { color: #3b82f6; }
    
    .save-btn { padding: 5px 14px; border-radius: 6px; border: none; background: #10b981; color: #fff; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .save-btn:hover { background: #059669; }

    .controls-group { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #64748b; }
    .select-control { padding: 3px 6px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; background: #fff; }
    .font-btn { padding: 2px 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; cursor: pointer; }
    .toolbar-bar { display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-bottom: none; border-top-left-radius: 8px; border-top-right-radius: 8px; padding: 6px 12px; flex-wrap: wrap; }
    .toolbar-btn { padding: 4px 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; color: #334155; display: flex; align-items: center; gap: 4px; }
    .editor-textarea { flex: 1; width: 100%; min-height: 280px; padding: 16px; border: 1px solid #e2e8f0; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; outline: none; font-size: 14px; line-height: 1.7; resize: none; background: #fafafa; color: #0f172a; }
    .editor-textarea:focus { border-color: #3b82f6; background: #fff; }
    .font-mono { font-family: "Consolas", "Fira Code", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-serif { font-family: "Georgia", serif; }
    .stats-bar { text-align: right; font-size: 12px; color: #94a3b8; padding-top: 2px; }

    .share-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; margin-top: 8px; transition: all 0.3s ease; }
    .share-toggle-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .share-header { font-size: 13px; font-weight: 600; color: #334155; display: flex; align-items: center; gap: 6px; }
    .share-body { display: none; margin-top: 12px; }
    .share-tips { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    .token-row { display: flex; gap: 8px; }
    .token-input { flex: 1; padding: 6px 10px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; }
    .btn-action { background: #2563eb; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .share-result { position: relative; display: none; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 14px; margin-top: 12px; }
    .close-share-btn { position: absolute; right: 12px; top: 10px; border: none; background: transparent; font-size: 16px; color: #166534; cursor: pointer; font-weight: bold; }
    .result-title { font-size: 12px; color: #166534; font-weight: 600; margin-bottom: 8px; }
    .link-input { width: 100%; padding: 8px; font-size: 12px; border: 1px solid #86efac; border-radius: 4px; color: #15803d; background: #fff; font-family: monospace; }
    .qr-container { margin-top: 12px; display: flex; justify-content: center; }

    .empty-state { margin: auto; text-align: center; color: #64748b; }
    .login-mask, .modal-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .login-card, .modal-card { background: #fff; padding: 24px; border-radius: 12px; width: 380px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .login-title, .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #0f172a; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #64748b; display: block; margin-bottom: 4px; }
    .login-input, .login-select { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
    .login-btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; margin-top: 8px; }
    .move-folder-tree { max-height: 260px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px; margin-bottom: 16px; background: #f8fafc; }
    .folder-select-item { padding: 8px 10px; font-size: 13px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #334155; margin-bottom: 2px; }
    .folder-select-item:hover { background: #e2e8f0; color: #2563eb; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-secondary { background: #e2e8f0; color: #475569; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .symbol-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 240px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; background: #f8fafc; margin-bottom: 14px; }
    .symbol-item { display: flex; justify-content: center; align-items: center; height: 38px; font-size: 18px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }
    .symbol-item:hover { background: #eff6ff; border-color: #2563eb; }

    .toast-undo { position: absolute; bottom: 20px; right: 20px; z-index: 1000; background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); font-size: 13px; display: flex; align-items: center; gap: 12px; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .undo-btn { background: #3b82f6; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .undo-btn:hover { background: #2563eb; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- 登录弹窗 -->
  <div class="login-mask" id="loginMask">
    <div class="login-card">
      <div class="login-title">🔐 管理员验证</div>
      <div class="form-group">
        <label class="form-label">控制台密码</label>
        <input type="password" id="passwordInput" class="login-input" placeholder="请输入密码" onkeyup="if(event.key==='Enter') login()">
      </div>
      <div class="form-group">
        <label class="form-label">登录保活时间</label>
        <select id="keepAliveSelect" class="login-select">
          <option value="3600000">1 小时</option>
          <option value="86400000" selected>1 天</option>
          <option value="2592000000">1 个月 (30天)</option>
        </select>
      </div>
      <button class="login-btn" onclick="login()">登 录</button>
    </div>
  </div>

  <!-- 移动位置弹窗 -->
  <div class="modal-mask" id="moveModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-title">📂 选择目标文件夹</div>
      <div class="move-folder-tree" id="moveFolderTree"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeMoveModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- 特殊符号弹窗 -->
  <div class="modal-mask" id="symbolModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-title">✨ 选择特殊符号</div>
      <div style="margin-bottom: 10px;">
        <select id="symbolCategorySelect" class="login-select" onchange="renderSymbols(this.value)">
          <option value="gesture">✋ 常用手势</option>
          <option value="flag">🚩 旗帜标识</option>
          <option value="mark">📌 常用标记与记号</option>
          <option value="math">∑ 数学与逻辑符号</option>
          <option value="arrow">➔ 常用箭头</option>
        </select>
      </div>
      <div class="symbol-grid" id="symbolGrid"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeSymbolModal()">关闭</button>
      </div>
    </div>
  </div>

  <div class="navbar">
    <span>🔑 文本云盘</span>
    <button style="border:none; background:none; color:#ef4444; cursor:pointer; font-size:12px;" onclick="logout()">退出登录</button>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">📁 文件清单</span>
        <div class="actions-group">
          <button class="icon-btn" title="新建文件" onclick="createNewItem('file')">📄 新建文件</button>
          <button class="icon-btn folder" title="新建文件夹" onclick="createNewItem('folder')">📁⁺</button>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索文件..." oninput="renderTree()">
      </div>
      <div class="file-tree" id="fileTree" onclick="closeAllDropdowns()"></div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="empty-state" id="emptyState">
        <p style="font-size:16px; font-weight:600; margin-bottom:12px; color:#475569;">选择或新建文件开始编辑</p>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn-action" onclick="createNewItem('file')">📄 新建文件</button>
          <button class="btn-action" style="background:#f59e0b;" onclick="createNewItem('folder')">📁 新建文件夹</button>
        </div>
      </div>

      <div class="editor-container" id="editorContainer">
        <div class="top-bar">
          <div style="display: flex; align-items: center; gap: 12px;">
            <button class="save-btn" onclick="manualSave()">💾 保存 (Ctrl+S)</button>
            <div class="save-status" id="saveStatus">✓ 已保存</div>
          </div>

          <div class="controls-group">
            <span>字体:</span>
            <select id="fontSelect" class="select-control" onchange="changeFontFamily(this.value)">
              <option value="font-mono" selected>等宽代码体</option>
              <option value="font-sans">无衬线字体</option>
              <option value="font-serif">衬线/宋体</option>
            </select>
            
            <span>字号:</span>
            <button class="font-btn" onclick="changeFontSize(-1)">-</button>
            <span id="fontSizeDisplay">20</span>
            <button class="font-btn" onclick="changeFontSize(1)">+</button>
          </div>
        </div>

        <div class="toolbar-bar">
          <select class="select-control" onchange="insertEmoji(this.value); this.selectedIndex=0;">
            <option value="" disabled selected>😀 快捷 Emoji</option>
            <option value="😀">😀 笑脸</option>
            <option value="👍">👍 赞</option>
            <option value="🎉">🎉 庆祝</option>
            <option value="🔥">🔥 热门</option>
            <option value="🚀">🚀 火箭</option>
            <option value="💡">💡 想法</option>
          </select>

          <button class="toolbar-btn" onclick="openSymbolModal()">✨ 插入特殊符号</button>
        </div>

        <textarea id="textEditor" class="editor-textarea font-mono" oninput="handleEditorInput()" onpaste="handlePasteEvent()"></textarea>
        <div class="stats-bar" id="statsBar">0 字 · 0 行</div>

        <div class="share-section" id="shareSection">
          <div class="share-toggle-header" onclick="toggleShareSection()">
            <div class="share-header">🔑 分享与订阅设置</div>
            <span id="shareArrow" style="font-size: 12px; color: #64748b;">▲ 点击展开</span>
          </div>
          
          <div class="share-body" id="shareBody">
            <div class="share-tips">自定义 Token 替代公开 URL，可随时重新生成使旧链接失效。</div>
            <div class="token-row">
              <input type="text" id="tokenInput" class="token-input" placeholder="自定义 Token（留空自动生成）">
              <button class="btn-action" onclick="generateShareLink()">生成 / 更新链接</button>
            </div>

            <div class="share-result" id="shareResult">
              <button class="close-share-btn" title="关闭" onclick="hideShareResult()">×</button>
              <div class="result-title">✓ 订阅/纯文本分享链接</div>
              <input type="text" id="shareUrlInput" class="link-input" readonly onclick="this.select(); document.execCommand('copy'); alert('链接已复制到剪贴板！');">
              <div class="qr-container" id="qrcode"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script>
    let items = [];
    let activeItemId = null;
    let movingTargetId = null;
    let selectedParentFolderId = null;
    let openFolderIds = new Set();
    let currentFontSize = CONFIG.EDITOR_DEFAULT.FONT_SIZE;
    let lastDeletedBatch = null;
    let undoTimer = null;
    let currentFetchController = null;
    let isDirty = false;

    const SYMBOL_SETS = {
      gesture: ["👍", "👎", "👌", "✌️", "🤞", "🤟", "🤘", "🤙", "👈", "👉", "👆", "👇", "✋", "🤚", "🖐️", "🖖", "👋", "👏", "🙌", "👐", "🤲", "🤝", "🙏", "✍️"],
      flag: ["🚩", "🏳️", "🏴", "🏁", "🎌", "🏳️‍🌈", "🏴‍☠️", "🇨🇳", "🇺🇸", "🇯🇵", "🇬🇧", "🇫🇷", "🇩🇪", "🇷🇺", "🇰🇷", "🇮🇳"],
      mark: ["📌", "📍", "🔖", "🏷️", "✅", "❌", "❎", "❓", "❗", "⚠️", "⛔", "🚫", "⚡", "💡", "🔔", "⭐", "🌟", "✨", "🎯", "💯", "⭕", "❌", "🔴", "🟢", "🔵", "🟡"],
      math: ["±", "×", "÷", "≈", "≠", "≤", "≥", "∞", "∑", "∏", "√", "∂", "∫", "∝", "∈", "∉", "⊆", "⊂", "∪", "∩", "⊥", "∠", "∴", "∵", "α", "β", "γ", "θ", "π"],
      arrow: ["➔", "➔", "➜", "➟", "➞", "⬆️", "⬇️", "⬅️", "➡️", "↗️", "↘️", "↙️", "↖️", "↔️", "↕️", "🔄", "🔄", "🔁", "🔂"]
    };

    function getStoredPassword() {
      const authData = localStorage.getItem('admin_auth');
      if (!authData) return null;
      try {
        const { pwd, expire } = JSON.parse(authData);
        if (Date.now() > expire) {
          localStorage.removeItem('admin_auth');
          return null;
        }
        return pwd;
      } catch (e) {
        return null;
      }
    }

    async function apiFetch(endpoint, options = {}) {
      const pwd = getStoredPassword();
      if (!pwd) {
        document.getElementById('loginMask').style.display = 'flex';
        throw new Error('未登录');
      }

      const headers = {
        'X-Admin-Password': pwd,
        ...(options.headers || {})
      };

      if (!(options.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }

      const res = await fetch(`${CONFIG.API_BASE}${endpoint}`, { ...options, headers });
      if (res.status === 401) {
        localStorage.removeItem('admin_auth');
        document.getElementById('loginMask').style.display = 'flex';
        throw new Error('鉴权失效');
      }
      return res;
    }

    async function login() {
      const pwd = document.getElementById('passwordInput').value.trim();
      const keepAliveMs = parseInt(document.getElementById('keepAliveSelect').value);
      if (!pwd) return alert('请输入密码');

      try {
        const res = await fetch(`${CONFIG.API_BASE}/api/auth/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pwd }
        });

        if (res.ok) {
          localStorage.setItem('admin_auth', JSON.stringify({ pwd, expire: Date.now() + keepAliveMs }));
          document.getElementById('loginMask').style.display = 'none';
          fetchItems();
        } else {
          alert('密码验证失败！');
        }
      } catch (e) {
        alert('登录出错: ' + e.message);
      }
    }

    function logout() {
      localStorage.removeItem('admin_auth');
      location.reload();
    }

    async function fetchItems() {
      try {
        const res = await apiFetch('/api/files');
        items = await res.json();
        renderTree();
      } catch (err) {
        console.error("加载文件列表失败", err);
      }
    }

    function renderTree() {
      const treeEl = document.getElementById('fileTree');
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      treeEl.innerHTML = '';

      if (keyword) {
        items.filter(i => i.name.toLowerCase().includes(keyword)).forEach(item => {
          treeEl.appendChild(createNodeWrapper(item, 0));
        });
        return;
      }

      renderNodes(null, 0, treeEl);
    }

    function renderNodes(parentId, level, container) {
      const children = items.filter(i => i.parentId === parentId);
      children.forEach(item => {
        const nodeWrapper = createNodeWrapper(item, level);
        container.appendChild(nodeWrapper);

        if (item.type === 'folder' && openFolderIds.has(item.id)) {
          renderNodes(item.id, level + 1, container);
        }
      });
    }

    function createNodeWrapper(item, level) {
      const wrapper = document.createElement('div');
      wrapper.className = 'tree-node-wrapper';

      const isFolder = item.type === 'folder';
      const isOpen = openFolderIds.has(item.id);

      const el = document.createElement('div');
      el.className = `tree-node ${activeItemId === item.id ? 'active' : ''}`;
      el.style.paddingLeft = `${level * 16 + 8}px`;

      el.innerHTML = `
        <div class="node-info">
          ${isFolder ? `<span class="arrow ${isOpen ? 'open' : ''}">▶</span>📁` : '📄'}
          <span>${item.name}</span>
        </div>
        <button class="more-btn" onclick="toggleDropdown(event, '${item.id}')">⋮</button>
      `;

      const menu = document.createElement('div');
      menu.className = 'dropdown-menu';
      menu.id = `dropdown-${item.id}`;
      
      let menuContent = '';
      if (!isFolder) {
        menuContent += `<div class="dropdown-item" onclick="viewShareLink(event, '${item.id}')">🔗 查看分享链接</div>`;
      }
      menuContent += `
        <div class="dropdown-item" onclick="openMoveModal(event, '${item.id}')">📂 移动到...</div>
        <div class="dropdown-item" onclick="renameItem(event, '${item.id}')">✏️ 重命名</div>
        <div class="dropdown-item danger" onclick="deleteItem(event, '${item.id}')">🗑️ 删除</div>
      `;
      menu.innerHTML = menuContent;

      el.onclick = async (e) => {
        e.stopPropagation();
        closeAllDropdowns();
        if (isFolder) {
          isOpen ? openFolderIds.delete(item.id) : openFolderIds.add(item.id);
          selectedParentFolderId = item.id;
          renderTree();
        } else {
          await selectFile(item.id);
        }
      };

      wrapper.appendChild(el);
      wrapper.appendChild(menu);
      return wrapper;
    }

    function toggleDropdown(e, id) {
      e.stopPropagation();
      closeAllDropdowns();
      const menu = document.getElementById(`dropdown-${id}`);
      if (menu) menu.style.display = 'block';
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
    }

    async function selectFile(id) {
      if (activeItemId === id) return;

      if (activeItemId && isDirty) {
        await flushSaveCurrentFile();
      }

      if (currentFetchController) currentFetchController.abort();
      currentFetchController = new AbortController();

      activeItemId = id;
      const file = items.find(i => i.id === id);
      if (!file) return;

      selectedParentFolderId = file.parentId;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('editorContainer').style.display = 'flex';
      document.getElementById('tokenInput').value = file.token || '';

      closeShareSection();
      const editor = document.getElementById('textEditor');

      if (typeof file._content !== 'undefined' && file._content !== null) {
        editor.value = file._content;
        updateStats();
        setSaveStatus('saved');
        renderTree();
      } else {
        editor.value = "正在加载...";
        updateStats();
        renderTree();
      }

      if (!file.token) {
        if (editor.value === "正在加载...") editor.value = "";
        file._content = editor.value;
        setSaveStatus('saved');
        return;
      }

      try {
        const res = await fetch(`${CONFIG.API_BASE}/sub/${file.token}/${encodeURIComponent(file.name)}?t=${Date.now()}`, {
          signal: currentFetchController.signal
        });

        if (res.ok) {
          const text = await res.text();
          file._content = text;
          if (activeItemId === id) {
            editor.value = text;
            updateStats();
            setSaveStatus('saved');
          }
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          console.error('获取文件失败:', e);
        }
      }
    }

    function setSaveStatus(status) {
      const statusEl = document.getElementById('saveStatus');
      if (!statusEl) return;
      
      if (status === 'saved') {
        isDirty = false;
        statusEl.textContent = '✓ 已保存';
        statusEl.className = 'save-status';
      } else if (status === 'unsaved') {
        isDirty = true;
        statusEl.textContent = '● 未保存';
        statusEl.className = 'save-status unsaved';
      } else if (status === 'saving') {
        statusEl.textContent = '⏳ 保存中...';
        statusEl.className = 'save-status saving';
      }
    }

    function toggleShareSection() {
      const body = document.getElementById('shareBody');
      body.style.display === 'block' ? closeShareSection() : openShareSection();
    }

    function openShareSection() {
      document.getElementById('shareBody').style.display = 'block';
      document.getElementById('shareArrow').textContent = '▼ 点击收起';
      setTimeout(() => {
        const contentArea = document.getElementById('contentArea');
        contentArea.scrollTo({ top: contentArea.scrollHeight, behavior: 'smooth' });
      }, 50);
    }

    function closeShareSection() {
      document.getElementById('shareBody').style.display = 'none';
      document.getElementById('shareArrow').textContent = '▲ 点击展开';
      hideShareResult();
    }

    async function createNewItem(type) {
      if (activeItemId && isDirty) await flushSaveCurrentFile();

      const label = type === 'folder' ? '文件夹' : '文件';
      const name = prompt(`请输入${label}名称:`, `新建${label}`);
      if (!name) return;

      const newItem = { id: Date.now().toString(), name, type, parentId: selectedParentFolderId, token: type === 'file' ? crypto.randomUUID() : "" };
      if (type === 'file') newItem._content = "";

      items.push(newItem);
      await saveItemToBackend(newItem);

      if (type === 'folder') {
        openFolderIds.add(newItem.id);
        renderTree();
      } else {
        await selectFile(newItem.id);
      }
    }

    async function renameItem(e, id) {
      e.stopPropagation();
      closeAllDropdowns();
      const item = items.find(i => i.id === id);
      if (!item) return;

      const newName = prompt('请输入新名称:', item.name);
      if (newName && newName !== item.name) {
        item.name = newName;
        await saveItemToBackend(item);
        renderTree();
      }
    }

    async function deleteItem(e, id) {
      e.stopPropagation();
      closeAllDropdowns();
      const target = items.find(i => i.id === id);
      if (!target) return;

      if (confirm(`确认删除 ${target.name} 吗？`)) {
        try {
          // 请求后端统一执行级联删除
          const res = await apiFetch(`/api/files/${id}`, { method: 'DELETE' });
          const data = await res.json();
          const deletedIds = data.deletedIds || [id];

          // 记录备份以备撤销
          const deletedItems = items.filter(i => deletedIds.includes(i.id));

          // 从本地 items 中彻底移除
          items = items.filter(i => !deletedIds.includes(i.id));

          if (deletedIds.includes(activeItemId)) {
            activeItemId = null;
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('editorContainer').style.display = 'none';
          }

          renderTree();
          showUndoToast(target.name, deletedItems);
        } catch (err) {
          alert('删除失败：' + err.message);
        }
      }
    }

    function showUndoToast(itemName, deletedItems) {
      lastDeletedBatch = deletedItems;
      const container = document.getElementById('toastContainer');

      container.innerHTML = `
        <div class="toast-undo" id="undoToast">
          <span>已删除 "${itemName}"</span>
          <button class="undo-btn" onclick="undoDelete()">撤销恢复</button>
        </div>
      `;

      clearTimeout(undoTimer);
      undoTimer = setTimeout(() => {
        const toast = document.getElementById('undoToast');
        if (toast) toast.remove();
        lastDeletedBatch = null;
      }, 7000);
    }

    async function undoDelete() {
      if (!lastDeletedBatch || lastDeletedBatch.length === 0) return;

      const restoredBatch = [...lastDeletedBatch];
      lastDeletedBatch = null;

      const toast = document.getElementById('undoToast');
      if (toast) toast.remove();

      for (const item of restoredBatch) {
        items.push(item);
        await saveItemToBackend(item);
        if (item.type === 'file' && item.token) {
          await apiFetch('/api/files/content', {
            method: 'POST',
            body: JSON.stringify({ id: item.id, token: item.token, content: item._content || '' })
          });
        }
      }

      renderTree();
      alert('还原成功！');
    }

    function openMoveModal(e, id) {
      e.stopPropagation();
      closeAllDropdowns();
      movingTargetId = id;

      const container = document.getElementById('moveFolderTree');
      container.innerHTML = '';

      const rootDiv = document.createElement('div');
      rootDiv.className = 'folder-select-item';
      rootDiv.innerHTML = '📁 [根目录]';
      rootDiv.onclick = () => selectTargetFolder(null);
      container.appendChild(rootDiv);

      function renderMoveFolderNodes(parentId, depth) {
        const folders = items.filter(i => i.type === 'folder' && i.id !== movingTargetId && i.parentId === parentId);
        folders.forEach(f => {
          const div = document.createElement('div');
          div.className = 'folder-select-item';
          div.style.paddingLeft = `${depth * 16 + 10}px`;
          div.innerHTML = `📁 ${f.name}`;
          div.onclick = () => selectTargetFolder(f.id);
          container.appendChild(div);
          renderMoveFolderNodes(f.id, depth + 1);
        });
      }

      renderMoveFolderNodes(null, 0);
      document.getElementById('moveModal').style.display = 'flex';
    }

    function closeMoveModal() {
      document.getElementById('moveModal').style.display = 'none';
      movingTargetId = null;
    }

    async function selectTargetFolder(targetParentId) {
      const item = items.find(i => i.id === movingTargetId);
      if (item) {
        item.parentId = targetParentId;
        await saveItemToBackend(item);
        renderTree();
      }
      closeMoveModal();
    }

    function openSymbolModal() {
      renderSymbols('gesture');
      document.getElementById('symbolCategorySelect').value = 'gesture';
      document.getElementById('symbolModal').style.display = 'flex';
    }

    function closeSymbolModal() {
      document.getElementById('symbolModal').style.display = 'none';
    }

    function renderSymbols(category) {
      const grid = document.getElementById('symbolGrid');
      grid.innerHTML = '';
      (SYMBOL_SETS[category] || []).forEach(sym => {
        const btn = document.createElement('div');
        btn.className = 'symbol-item';
        btn.textContent = sym;
        btn.onclick = () => { insertAtCursor(sym); closeSymbolModal(); };
        grid.appendChild(btn);
      });
    }

    async function viewShareLink(e, id) {
      e.stopPropagation();
      closeAllDropdowns();
      await selectFile(id);
      
      const file = items.find(i => i.id === id);
      openShareSection();
      if (file && file.token) showShareResult(file.token);
    }

    function insertAtCursor(text) {
      const editor = document.getElementById('textEditor');
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const val = editor.value;
      editor.value = val.substring(0, start) + text + val.substring(end);
      editor.selectionStart = editor.selectionEnd = start + text.length;
      editor.focus();
      handleEditorInput();
    }

    function insertEmoji(emoji) {
      if (emoji) insertAtCursor(emoji);
    }

    function handlePasteEvent() {
      setTimeout(() => handleEditorInput(), 50);
    }

    function handleEditorInput() {
      updateStats();
      const file = items.find(i => i.id === activeItemId);
      if (file) file._content = document.getElementById('textEditor').value;
      setSaveStatus('unsaved');
    }

    async function manualSave() {
      await flushSaveCurrentFile();
    }

    async function flushSaveCurrentFile() {
      if (!activeItemId) return;

      const file = items.find(i => i.id === activeItemId);
      if (!file || file.type !== 'file') return;

      setSaveStatus('saving');
      const content = document.getElementById('textEditor').value;
      file._content = content;

      if (!file.token) file.token = crypto.randomUUID();

      try {
        await saveItemToBackend(file);
        await apiFetch('/api/files/content', {
          method: 'POST',
          body: JSON.stringify({ id: file.id, token: file.token, content: content })
        });
        setSaveStatus('saved');
      } catch (e) {
        console.error("保存失败:", e);
        const statusEl = document.getElementById('saveStatus');
        if (statusEl) {
          statusEl.textContent = '❌ 保存失败';
          statusEl.className = 'save-status unsaved';
        }
      }
    }

    async function saveItemToBackend(item) {
      const { _content, ...itemData } = item;
      await apiFetch('/api/files/save', {
        method: 'POST',
        body: JSON.stringify(itemData)
      });
    }

    async function generateShareLink() {
      const file = items.find(i => i.id === activeItemId);
      if (!file || file.type !== 'file') return;

      let token = document.getElementById('tokenInput').value.trim() || crypto.randomUUID();
      document.getElementById('tokenInput').value = token;

      file.token = token;
      await flushSaveCurrentFile();
      showShareResult(token);
    }

    function showShareResult(token) {
      const file = items.find(i => i.id === activeItemId);
      const shareUrl = `${CONFIG.API_BASE}/sub/${token}/${encodeURIComponent(file.name)}`;
      document.getElementById('shareUrlInput').value = shareUrl;
      document.getElementById('shareResult').style.display = 'block';

      const qr = qrcode(0, 'M');
      qr.addData(shareUrl);
      qr.make();
      document.getElementById('qrcode').innerHTML = qr.createImgTag(4);
    }

    function hideShareResult() {
      document.getElementById('shareResult').style.display = 'none';
    }

    function updateStats() {
      const text = document.getElementById('textEditor').value;
      document.getElementById('statsBar').textContent = `${text.length} 字 · ${text ? text.split('\n').length : 1} 行`;
    }

    function changeFontSize(delta) {
      currentFontSize += delta;
      document.getElementById('fontSizeDisplay').textContent = currentFontSize;
      document.getElementById('textEditor').style.fontSize = `${currentFontSize}px`;
    }

    function changeFontFamily(fontClass) {
      document.getElementById('textEditor').className = `editor-textarea ${fontClass}`;
    }

    // 全局快捷键 Ctrl+S / Cmd+S
    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        manualSave();
      }
    });

    // 页面关闭前的状态保护
    window.addEventListener('beforeunload', function (e) {
      if (isDirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    if (getStoredPassword()) {
      document.getElementById('loginMask').style.display = 'none';
      fetchItems();
    } else {
      document.getElementById('loginMask').style.display = 'flex';
    }
  </script>
</body>
</html>
