<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本云盘</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .navbar {
      height: 48px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-weight: 600;
      font-size: 15px;
    }
    .main-container { flex: 1; display: flex; overflow: hidden; }
    
    /* 侧边栏 */
    .sidebar { width: 260px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-title { font-size: 13px; font-weight: 600; }
    .actions-group { display: flex; gap: 4px; }
    .icon-btn {
      width: 26px; height: 26px; border-radius: 4px; border: none;
      background: #22c55e; color: #fff; cursor: pointer; font-size: 12px;
    }
    .icon-btn.folder { background: #f59e0b; }
    
    .search-box { padding: 0 12px 12px; }
    .search-input { width: 100%; padding: 5px 8px; font-size: 12px; border: 1px solid #e2e8f0; border-radius: 4px; outline: none; }
    
    /* 树状结构样式 */
    .file-tree { flex: 1; overflow-y: auto; padding: 0 4px; user-select: none; }
    .tree-node {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; border-radius: 4px; font-size: 13px; cursor: pointer;
      margin-bottom: 2px;
    }
    .tree-node:hover { background: #f1f5f9; }
    .tree-node.active { background: #e0f2fe; color: #0284c7; font-weight: 500; }
    .node-info { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { display: inline-block; width: 12px; font-size: 10px; color: #94a3b8; transition: transform 0.2s; }
    .arrow.open { transform: rotate(90deg); }

    /* 工作区 */
    .content-area { flex: 1; display: flex; flex-direction: column; background: #f8fafc; overflow-y: auto; }
    .editor-container { display: none; flex-direction: column; height: 100%; padding: 16px; gap: 12px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-save { background: #2563eb; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }
    .font-control { font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 8px; }
    .font-btn { padding: 2px 6px; border: 1px solid #cbd5e1; background: #fff; border-radius: 3px; cursor: pointer; }
    
    .editor-textarea {
      flex: 1; width: 100%; min-height: 240px; padding: 12px; border: 1px solid #e2e8f0;
      border-radius: 6px; outline: none; font-family: monospace; font-size: 14px; line-height: 1.6; resize: vertical;
    }
    .stats-bar { text-align: right; font-size: 12px; color: #94a3b8; }

    /* 分享卡片 */
    .share-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px; margin-top: 10px; }
    .share-header { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px; }
    .share-tips { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    .token-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .token-input { flex: 1; padding: 8px 12px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; }
    .btn-action { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }

    .share-result { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 12px; margin-top: 10px; }
    .result-title { font-size: 13px; color: #166534; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .link-input { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #86efac; border-radius: 4px; color: #15803d; background: #fff; font-family: monospace; }
    .qr-container { margin-top: 16px; display: flex; justify-content: center; }

    .empty-state { margin: auto; text-align: center; color: #64748b; }

    /* 🔒 密码登录遮罩层 */
    .login-mask {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center; z-index: 999;
    }
    .login-card {
      background: #fff; padding: 24px; border-radius: 8px; width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;
    }
    .login-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #0f172a; }
    .login-input { width: 100%; padding: 8px 12px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 4px; margin-bottom: 16px; outline: none; }
    .login-btn { width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
  </style>
</head>
<body>

  <!-- 🔒 密码验证弹窗 -->
  <div class="login-mask" id="loginMask">
    <div class="login-card">
      <div class="login-title">🔐 身份验证</div>
      <input type="password" id="passwordInput" class="login-input" placeholder="请输入管理密码" onkeyup="if(event.key==='Enter') login()">
      <button class="login-btn" onclick="login()">进入系统</button>
    </div>
  </div>

  <div class="navbar">
    <span>🔑 文本云盘</span>
    <button style="border:none; background:none; color:#ef4444; cursor:pointer; font-size:12px;" onclick="logout()">退出登录</button>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">📁 文件管理</span>
        <div class="actions-group">
          <button class="icon-btn" title="新建文件" onclick="createNewItem('file')">📄⁺</button>
          <button class="icon-btn folder" title="新建文件夹" onclick="createNewItem('folder')">📁⁺</button>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索文件..." oninput="renderTree()">
      </div>
      <div class="file-tree" id="fileTree"></div>
    </div>

    <div class="content-area">
      <div class="empty-state" id="emptyState">
        <p style="font-size:18px; font-weight:bold; margin-bottom:8px;">选择或新建文件开始编辑</p>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn-action" onclick="createNewItem('file')">📄 新建文件</button>
          <button class="btn-action" style="background:#f59e0b;" onclick="createNewItem('folder')">📁 新建文件夹</button>
        </div>
      </div>

      <div class="editor-container" id="editorContainer">
        <div class="top-bar">
          <button class="btn-save" onclick="saveCurrentFile()">💾 保存</button>
          <div class="font-control">
            字号
            <button class="font-btn" onclick="changeFontSize(-1)">-</button>
            <span id="fontSizeDisplay">14</span>
            <button class="font-btn" onclick="changeFontSize(1)">+</button>
            <span style="margin-left:12px;">当前: <strong id="currentFileName">未命名</strong></span>
          </div>
        </div>

        <textarea id="textEditor" class="editor-textarea" oninput="updateStats()"></textarea>
        <div class="stats-bar" id="statsBar">0 字 · 0 行</div>

        <div class="share-section">
          <div class="share-header">🔑 分享设置</div>
          <div class="share-tips">Token 永久有效，可随时重新生成 Token 替换旧链接使之失效。</div>
          
          <div class="token-row">
            <input type="text" id="tokenInput" class="token-input" placeholder="自定义 Token（留空则自动生成 UUID）">
            <button class="btn-action" onclick="generateShareLink()">生成 / 更新</button>
          </div>

          <div class="share-result" id="shareResult">
            <div class="result-title">
              <span>✓ 分享链接已生成</span>
              <span style="color:#ef4444; cursor:pointer;" onclick="hideShareResult()">撤销</span>
            </div>
            <input type="text" id="shareUrlInput" class="link-input" readonly onclick="this.select(); document.execCommand('copy'); alert('链接已复制到剪贴板！');">
            <p style="font-size:11px; color:#15803d; margin-top:4px;">点击链接框即可复制</p>
            <div class="qr-container" id="qrcode"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://your-worker-subdomain.workers.dev"; // ⚠️ 修改为您的 Worker 域名

    let items = [];
    let activeItemId = null;
    let selectedParentFolderId = null;
    let openFolderIds = new Set();
    let currentFontSize = 14;

    function getStoredPassword() {
      return localStorage.getItem('admin_pwd') || '';
    }

    // 封装 API 请求，统一附带密码 Header
    async function apiFetch(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'X-Admin-Password': getStoredPassword(),
        ...(options.headers || {})
      };

      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      if (res.status === 401) {
        document.getElementById('loginMask').style.display = 'flex';
        throw new Error('密码校验失败');
      }
      return res;
    }

    async function login() {
      const pwd = document.getElementById('passwordInput').value.trim();
      if (!pwd) return alert('请输入密码');

      try {
        const res = await fetch(`${API_BASE}/api/auth/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pwd }
        });

        if (res.ok) {
          localStorage.setItem('admin_pwd', pwd);
          document.getElementById('loginMask').style.display = 'none';
          fetchItems();
        } else {
          alert('密码错误！');
        }
      } catch (e) {
        alert('登录异常: ' + e.message);
      }
    }

    function logout() {
      localStorage.removeItem('admin_pwd');
      location.reload();
    }

    async function fetchItems() {
      try {
        const res = await apiFetch('/api/files');
        items = await res.json();
        renderTree();
      } catch (err) {
        console.error("加载列表失败", err);
      }
    }

    function renderTree() {
      const treeEl = document.getElementById('fileTree');
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      treeEl.innerHTML = '';

      if (keyword) {
        items.filter(i => i.name.toLowerCase().includes(keyword)).forEach(item => {
          treeEl.appendChild(createNodeElement(item, 0));
        });
        return;
      }

      renderNodes(null, 0, treeEl);
    }

    function renderNodes(parentId, level, container) {
      const children = items.filter(i => i.parentId === parentId);
      children.forEach(item => {
        const nodeEl = createNodeElement(item, level);
        container.appendChild(nodeEl);

        if (item.type === 'folder' && openFolderIds.has(item.id)) {
          renderNodes(item.id, level + 1, container);
        }
      });
    }

    function createNodeElement(item, level) {
      const el = document.createElement('div');
      el.className = `tree-node ${activeItemId === item.id ? 'active' : ''}`;
      el.style.paddingLeft = `${level * 16 + 8}px`;

      const isFolder = item.type === 'folder';
      const isOpen = openFolderIds.has(item.id);

      el.innerHTML = `
        <div class="node-info">
          ${isFolder ? `<span class="arrow ${isOpen ? 'open' : ''}">▶</span>📁` : '📄'}
          <span>${item.name}</span>
        </div>
        <span onclick="deleteItem(event, '${item.id}')" style="color:#ef4444; padding:0 4px;">✕</span>
      `;

      el.onclick = (e) => {
        e.stopPropagation();
        if (isFolder) {
          if (openFolderIds.has(item.id)) {
            openFolderIds.delete(item.id);
          } else {
            openFolderIds.add(item.id);
          }
          selectedParentFolderId = item.id;
          renderTree();
        } else {
          selectFile(item.id);
        }
      };

      return el;
    }

    async function selectFile(id) {
      activeItemId = id;
      const file = items.find(i => i.id === id);
      if (!file) return;

      selectedParentFolderId = file.parentId;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('editorContainer').style.display = 'flex';
      document.getElementById('currentFileName').textContent = file.name;
      document.getElementById('tokenInput').value = file.token || '';

      // 获取文本内容（/sub 接口是公开的）
      const res = await fetch(`${API_BASE}/sub/${file.token}/${encodeURIComponent(file.name)}`);
      if (res.ok) {
        document.getElementById('textEditor').value = await res.text();
      } else {
        document.getElementById('textEditor').value = '';
      }

      updateStats();
      if (file.token) {
        showShareResult(file.token);
      } else {
        document.getElementById('shareResult').style.display = 'none';
      }
      renderTree();
    }

    async function createNewItem(type) {
      const label = type === 'folder' ? '文件夹' : '文件';
      const name = prompt(`请输入${label}名称:`, `新建${label}-${Date.now().toString().slice(-4)}`);
      if (!name) return;

      const newItem = {
        id: Date.now().toString(),
        name,
        type,
        parentId: selectedParentFolderId,
        token: "",
        content: ""
      };

      items.push(newItem);
      await saveItemToBackend(newItem);

      if (type === 'folder') {
        openFolderIds.add(newItem.id);
        renderTree();
      } else {
        selectFile(newItem.id);
      }
    }

    async function saveCurrentFile() {
      const file = items.find(i => i.id === activeItemId);
      if (!file) return;

      file.content = document.getElementById('textEditor').value;
      await saveItemToBackend(file);
      alert('保存成功！');
    }

    async function saveItemToBackend(item) {
      await apiFetch('/api/files/save', {
        method: 'POST',
        body: JSON.stringify(item)
      });
    }

    async function generateShareLink() {
      const file = items.find(i => i.id === activeItemId);
      if (!file || file.type !== 'file') return;

      let token = document.getElementById('tokenInput').value.trim();
      if (!token) {
        token = crypto.randomUUID();
        document.getElementById('tokenInput').value = token;
      }

      file.token = token;
      file.content = document.getElementById('textEditor').value;
      
      await saveItemToBackend(file);
      showShareResult(token);
    }

    function showShareResult(token) {
      const file = items.find(i => i.id === activeItemId);
      const shareUrl = `${API_BASE}/sub/${token}/${encodeURIComponent(file.name)}`;
      document.getElementById('shareUrlInput').value = shareUrl;
      document.getElementById('shareResult').style.display = 'block';

      const qr = qrcode(0, 'M');
      qr.addData(shareUrl);
      qr.make();
      document.getElementById('qrcode').innerHTML = qr.createImgTag(4);
    }

    function hideShareResult() {
      document.getElementById('shareResult').style.display = 'none';
    }

    async function deleteItem(e, id) {
      e.stopPropagation();
      const target = items.find(i => i.id === id);
      if (!target) return;

      const isFolder = target.type === 'folder';
      const msg = isFolder ? '确认删除该文件夹及其内部所有内容吗？' : '确认删除该文件吗？';

      if (confirm(msg)) {
        const idsToDelete = [id];
        if (isFolder) {
          const findChildren = (pid) => {
            items.filter(i => i.parentId === pid).forEach(child => {
              idsToDelete.push(child.id);
              if (child.type === 'folder') findChildren(child.id);
            });
          };
          findChildren(id);
        }

        for (const deleteId of idsToDelete) {
          await apiFetch(`/api/files/${deleteId}`, { method: 'DELETE' });
        }

        items = items.filter(i => !idsToDelete.includes(i.id));

        if (idsToDelete.includes(activeItemId)) {
          activeItemId = null;
          document.getElementById('emptyState').style.display = 'flex';
          document.getElementById('editorContainer').style.display = 'none';
        }

        renderTree();
      }
    }

    function updateStats() {
      const text = document.getElementById('textEditor').value;
      document.getElementById('statsBar').textContent = `${text.length} 字 · ${text ? text.split('\n').length : 1} 行`;
    }

    function changeFontSize(delta) {
      currentFontSize += delta;
      document.getElementById('fontSizeDisplay').textContent = currentFontSize;
      document.getElementById('textEditor').style.fontSize = `${currentFontSize}px`;
    }

    // 页面加载时自动检查是否有密码
    if (getStoredPassword()) {
      document.getElementById('loginMask').style.display = 'none';
      fetchItems();
    } else {
      document.getElementById('loginMask').style.display = 'flex';
    }
  </script>
</body>
</html>
